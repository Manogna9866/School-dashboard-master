<div class="card">

  <!-- HEADER -->
  <div class="header">
    <h2>Exams</h2>

    <div class="header-actions">
      <input class="search-input" type="text" placeholder="Search exams..." [(ngModel)]="searchText"
        (input)="applyFilter()" />

      <button class="btn primary" (click)="openAdd()">+ Add Exam</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Exam Name</th>
          <th>Class</th>
          <th>Faculty</th>
          <th>Subject</th>
          <th>Date</th>
          <th>Status</th>
          <th width="140">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let e of paginatedExams">
          <td>{{ e.id }}</td>
          <td>{{ e.exam_name }}</td>
          <td>{{ e.class_id }}</td>
          <td>{{ e.faculty_id }}</td>
          <td>{{ e.subject }}</td>
          <td>{{ e.date_time | date:'short' }}</td>
          <td>
            <span class="status" [class.active]="e.status === 'active'">
              {{ e.status }}
            </span>
          </td>
          <td class="actions-col">
            <button class="btn outline" (click)="openEdit(e)">Edit</button>
            <button class="btn danger" (click)="deleteExam(e.id)">Delete</button>
          </td>
        </tr>

        <tr *ngIf="!paginatedExams.length">
          <td colspan="8" class="no-data">No exams found</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- PAGINATION -->
  <div class="pagination">
    <button class="btn outline" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">Prev</button>
    <span>Page {{ currentPage }} of {{ pages.length }}</span>
    <button class="btn outline" [disabled]="currentPage === pages.length || pages.length === 0"
      (click)="changePage(currentPage + 1)">Next</button>
  </div>

</div>

<!-- MODAL -->
<div class="modal" *ngIf="showModal">
  <div class="modal-content">
    <h3>{{ editId ? 'Edit Exam' : 'Add Exam' }}</h3>

    <form [formGroup]="examForm" class="school-form">
      <div>
        <label>School</label>
        <select formControlName="school_id">
          <option value="">Select School</option>
          <option *ngFor="let s of schools" [value]="s.id">{{ s.school_name }}</option>
        </select>
      </div>

      <div>
        <label>Branch</label>
        <select formControlName="branch_id">
          <option value="">Select Branch</option>
          <option *ngFor="let b of branches" [value]="b.id">{{ b.branch_name }}</option>
        </select>
      </div>

      <div>
        <label>Class</label>
        <select formControlName="class_id">
          <option value="">Select Class</option>
          <option *ngFor="let c of classes" [value]="c.id">{{ c.class_name }}</option>
        </select>
      </div>

      <div>
        <label>Faculty</label>
        <select formControlName="faculty_id">
          <option value="">Select Faculty</option>
          <option *ngFor="let f of faculties" [value]="f.id">{{ f.first_name }} {{ f.last_name }}</option>
        </select>
      </div>

      <div>
        <label>Exam Name</label>
        <input formControlName="exam_name" />
      </div>

      <div>
        <label>Exam Type</label>
        <select formControlName="exam_type">
          <option value="">Select</option>
          <option>Unit Test</option>
          <option>Mid Term</option>
          <option>Final</option>
        </select>
      </div>

      <div>
        <label>Term</label>
        <input formControlName="term" />
      </div>

      <div>
        <label>Subject</label>
        <input formControlName="subject" />
      </div>

      <div>
        <label>Date & Time</label>
        <input type="datetime-local" formControlName="date_time" />
      </div>

      <div>
        <label>Total Marks</label>
        <input type="number" formControlName="total_marks" />
      </div>

      <div>
        <label>Passing Marks</label>
        <input type="number" formControlName="passing_marks" />
      </div>

      <div>
        <label>Status</label>
        <select formControlName="status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    </form>

    <div class="actions">
      <button class="btn outline" (click)="showModal=false">Cancel</button>
      <button class="btn primary" (click)="save()">Save</button>
    </div>
  </div>
</div>
