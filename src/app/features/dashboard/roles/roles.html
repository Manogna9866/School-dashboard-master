<div class="card">

  <!-- Header -->
  <div class="header">
    <h2>Roles</h2>

    <div class="header-actions">
      <input
        type="text"
        class="search-input"
        placeholder="Search roles..."
        [(ngModel)]="searchText"
        (input)="applyFilter()"
      />

      <button class="btn primary" (click)="openAdd()">+ Add Role</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Role</th>
          <th>Description</th>
          <th>Users</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let role of paginatedRoles">
          <td>{{ role.id }}</td>
          <td>{{ role.role_name }}</td>
          <td>{{ role.description }}</td>
          <td>{{ role.user_count }}</td>
          <td class="actions-col">
            <button class="btn outline" (click)="openEdit(role)">Edit</button>
            <button class="btn danger" (click)="delete(role.id)">Delete</button>
          </td>
        </tr>

        <tr *ngIf="!paginatedRoles.length">
          <td colspan="5" class="no-data">No roles found</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination">
    <button
      class="btn outline"
      [disabled]="currentPage === 1"
      (click)="changePage(currentPage - 1)">
      Prev
    </button>

    <!-- <span>Page {{ currentPage }} of {{ totalPages() }}</span> -->

    <button
      class="btn outline"
      [disabled]="currentPage === totalPages() || totalPages() === 0"
      (click)="changePage(currentPage + 1)">
      Next
    </button>
  </div>
</div>

<!-- Modal -->
<div class="modal" *ngIf="showModal">
  <div class="modal-content">
    <h3>{{ editId ? 'Edit Role' : 'Add Role' }}</h3>

    <form [formGroup]="roleForm">
      <label>Role Name</label>
      <input formControlName="role_name" />

      <label>Description</label>
      <textarea formControlName="description"></textarea>
    </form>

    <div class="actions">
      <button class="btn outline" (click)="showModal = false">Cancel</button>
      <button class="btn primary" (click)="save()">Save</button>
    </div>
  </div>
</div>
