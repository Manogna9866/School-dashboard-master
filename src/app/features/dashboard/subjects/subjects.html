<div class="card">

  <!-- HEADER -->
  <div class="header">
    <h2>Subjects</h2>

    <div class="header-actions">
      <input
        class="search-input"
        type="text"
        placeholder="Search subjects..."
        [(ngModel)]="searchText"
        (input)="applyFilter()" />

      <button class="btn primary" (click)="openAdd()">+ Add Subject</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Code</th>
          <th>Type</th>
          <th>Passing Marks</th>
          <th>Max Marks</th>
          <th width="140">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let s of paginatedSubjects">
          <td>{{ s.id }}</td>
          <td>{{ s.name }}</td>
          <td>{{ s.code }}</td>
          <td>{{ s.sub_type }}</td>
          <td>{{ s.passing_marks }}</td>
          <td>{{ s.max_marks }}</td>
          <td class="actions-col">
            <button class="btn outline" (click)="openEdit(s)">Edit</button>
            <button class="btn danger" (click)="delete(s.id)">Delete</button>
          </td>
        </tr>

        <tr *ngIf="!paginatedSubjects.length">
          <td colspan="7" class="no-data">No subjects found</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- PAGINATION -->
  <div class="pagination">
    <button class="btn outline"
      [disabled]="currentPage === 1"
      (click)="changePage(currentPage - 1)">Prev</button>

    <span>Page {{ currentPage }} of {{ pages.length }}</span>

    <button class="btn outline"
      [disabled]="currentPage === pages.length || pages.length === 0"
      (click)="changePage(currentPage + 1)">Next</button>
  </div>

</div>

<!-- MODAL -->
<div class="modal" *ngIf="showModal">
  <div class="modal-content">

    <h3>{{ editId ? 'Edit Subject' : 'Add Subject' }}</h3>

    <form [formGroup]="subjectForm" class="school-form">

      <div>
        <label>Name</label>
        <input formControlName="name" />
      </div>

      <div>
        <label>Code</label>
        <input formControlName="code" />
      </div>

      <div>
        <label>Subject Type</label>
        <select formControlName="sub_type">
          <option value="">Select</option>
          <option>Theory</option>
          <option>Practical</option>
        </select>
      </div>

      <div>
        <label>Passing Marks</label>
        <input type="number" formControlName="passing_marks" />
      </div>

      <div>
        <label>Max Marks</label>
        <input type="number" formControlName="max_marks" />
      </div>

    </form>

    <div class="actions">
      <button class="btn outline" (click)="showModal=false">Cancel</button>
      <button class="btn primary" (click)="save()">Save</button>
    </div>

  </div>
</div>
