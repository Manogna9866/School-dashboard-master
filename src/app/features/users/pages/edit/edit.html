 <h3>Edit User</h3>

    <div class="card p-3" *ngIf="form">
      <div class="mb-2">
        <label>Name</label>
        <input class="form-control" [(ngModel)]="form.name" />
      </div>

      <div class="mb-2">
        <label>Email</label>
        <input class="form-control" [(ngModel)]="form.email" />
      </div>

      <div class="mb-3">
        <label>Role</label>
        <select class="form-select" [(ngModel)]="form.role_id">
          <option value="1">Super Admin</option>
          <option value="2">Admin</option>
        </select>
      </div>

      <button class="btn btn-primary" (click)="update()">Update</button>
      <button class="btn btn-secondary ms-2" (click)="cancel()">Cancel</button>
    </div>
